<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fcfbf9" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="robots" content="noai, noimageai" />

    <!-- Primary SEO -->
    <title>Isam Bahia — Artist &amp; Painter | Paintings Portfolio</title>
    <meta
      name="description"
      content="The painting portfolio of Isam Bahia (MFA) — landscape, impressionist, still life, portrait and abstract work. A UK-based artist exhibiting across Scotland and England, with work in private collections throughout the United Kingdom and Europe."
    />
    <meta name="author" content="Isam Bahia" />
    <link rel="canonical" href="https://isambahia.com/" />

    <!-- Open Graph (link previews on Facebook, WhatsApp, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Isam Bahia" />
    <meta property="og:title" content="Isam Bahia — Artist &amp; Painter" />
    <meta
      property="og:description"
      content="Paintings by Isam Bahia (MFA) — landscape, impressionist, still life and abstract work. A UK artist exhibiting across Scotland and England."
    />
    <meta property="og:url" content="https://isambahia.com/" />
    <meta property="og:image" content="https://isambahia.com/artwork/IsamPortrait.jpg" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Isam Bahia — Artist &amp; Painter" />
    <meta
      name="twitter:description"
      content="Paintings by Isam Bahia (MFA) — landscape, impressionist, still life and abstract work."
    />
    <meta name="twitter:image" content="https://isambahia.com/artwork/IsamPortrait.jpg" />

    <!-- Structured data: who Isam is, for rich results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Isam Bahia",
        "url": "https://isambahia.com/",
        "image": "https://isambahia.com/artwork/IsamPortrait.jpg",
        "email": "IsamBahiaArtist@outlook.com",
        "jobTitle": "Artist and Painter",
        "hasCredential": "MFA (Master of Fine Arts), University of Reading",
        "knowsAbout": [
          "Painting",
          "Landscape painting",
          "Impressionism",
          "Still life",
          "Portraiture",
          "Abstract art"
        ],
        "workLocation": [
          { "@type": "Country", "name": "United Kingdom" },
          { "@type": "AdministrativeArea", "name": "Scotland" },
          { "@type": "AdministrativeArea", "name": "England" }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap"
